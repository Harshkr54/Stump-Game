<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stump Game</title>
    <link rel="stylesheet" href="stump.css">
</head>
<body>
    <h2>Stump Game</h2>
    
    <button id="Bat">BAT</button>
    <button id="Ball">BALL</button>
    <button id="Stump">STUMP</button>
    <button id="Reset">RESET</button> 

    <div class="result">Result</div>
    
    <div class="winLoss">
        <div class="user-score">User Wins: 0 | User Losses: 0</div>
        <div class="computer-score">Computer Wins: 0 | Computer Losses: 0</div>
        <div class="tie-score">Ties: 0</div>
    </div>

    <script src="stump.js"></script>
</body>
</html>
